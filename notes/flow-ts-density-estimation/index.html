<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Density Notes</title>
<meta name="description" content="Shawn Kim's research notes on flow-based time-series density estimation.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/vendor/katex/katex.min.css">
<script defer src="../../assets/vendor/katex/katex.min.js"></script>
<script defer src="../../assets/vendor/marked/marked.min.js"></script>
<style>
:root{--text:#222;--muted:#666;--rule:#ddd;--link:#1a0dab;--code:#f5f5f5;--bg:#fff}
@media (prefers-color-scheme: dark){:root{--text:#e6e6e6;--muted:#9a9a9a;--rule:#444;--link:#8ab4f8;--code:#1e1e1e;--bg:#121212}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.65}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:48px 24px}
.back{font-size:15px}
.page-title{margin:24px 0 4px;font-size:30px;font-weight:600;line-height:1.25}
.sub{margin:0;color:var(--muted)}
nav.toc{margin:28px 0 0;padding:14px 18px;border:1px solid var(--rule);border-radius:4px}
nav.toc p{margin:0 0 6px;font-weight:600}
nav.toc ol{margin:0;padding-left:20px}
article{margin-top:48px;padding-top:8px;border-top:1px solid var(--rule)}
article h1{font-size:26px;font-weight:600;margin:24px 0 8px}
article h2{font-size:20px;font-weight:600;margin:36px 0 8px}
article h3{font-size:17px;font-weight:600;margin:24px 0 6px}
article p,article li{max-width:42em}
article table{border-collapse:collapse;margin:16px 0;font-size:15px}
article th,article td{border-bottom:1px solid var(--rule);padding:6px 14px 6px 0;text-align:left;vertical-align:top}
article code{background:var(--code);padding:1px 4px;border-radius:3px;font-size:14px}
article pre{background:var(--code);padding:12px 14px;border-radius:4px;overflow-x:auto}
article pre code{padding:0}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.status{color:var(--muted)}
footer{margin-top:64px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">Shawn Kim</a>
  <h1 class="page-title">Flow-Based Time-Series Density Estimation</h1>
  <p class="sub">Research notes</p>
  <nav class="toc" id="toc" hidden><p>Contents</p><ol id="toc-list"></ol></nav>
  <div id="notes"><p class="status">Loading notes…</p></div>
  <footer>© 2026 Shawn Kim</footer>
</div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var box = document.getElementById('notes');

  function renderMath(src) {
    // Pull math out before Markdown parsing so underscores and backslashes survive.
    var math = [];
    var parts = src.split(/(```[\s\S]*?```|`[^`\n]*`)/); // leave code untouched
    for (var i = 0; i < parts.length; i += 2) {
      parts[i] = parts[i]
        .replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) { math.push([tex, true]); return '\n\nMATHBLOCK' + (math.length - 1) + 'END\n\n'; })
        .replace(/\$([^\$\n]+?)\$/g, function (_, tex) { math.push([tex, false]); return 'MATHINLINE' + (math.length - 1) + 'END'; });
    }
    var html = marked.parse(parts.join(''));
    html = html.replace(/<p>MATHBLOCK(\d+)END<\/p>|MATHBLOCK(\d+)END|MATHINLINE(\d+)END/g, function (_, a, b, c) {
      var m = math[+(a || b || c)];
      try { return katex.renderToString(m[0], { displayMode: m[1], throwOnError: false }); }
      catch (e) { return m[0]; }
    });
    return html;
  }

  function stripFrontMatter(text) { return text.replace(/^---\n[\s\S]*?\n---\n/, ''); }

  fetch('manifest.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (list) {
      return Promise.all(list.map(function (n) {
        return fetch('md/' + n.file, { cache: 'no-cache' }).then(function (r) { return r.text(); })
          .then(function (t) { return { meta: n, text: t }; });
      }));
    })
    .then(function (notes) {
      box.innerHTML = '';
      var toc = document.getElementById('toc-list');
      notes.forEach(function (n) {
        var id = n.meta.file.replace(/\.md$/, '');
        var art = document.createElement('article');
        art.id = id;
        art.innerHTML = renderMath(stripFrontMatter(n.text));
        box.appendChild(art);
        var li = document.createElement('li');
        li.innerHTML = '<a href="#' + id + '"></a>';
        li.firstChild.textContent = n.meta.title;
        toc.appendChild(li);
      });
      if (notes.length > 1) document.getElementById('toc').hidden = false;
      if (location.hash) { var t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
    })
    .catch(function () {
      box.innerHTML = '<p class="status">The notes could not be loaded. Refresh the page to try again.</p>';
    });
});
</script>
</body>
</html>
